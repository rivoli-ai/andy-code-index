services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: andy-code-index-postgres
    environment:
      POSTGRES_DB: andy_code_index
      POSTGRES_USER: andy_code_index
      POSTGRES_PASSWORD: andy_code_index_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andy_code_index -d andy_code_index"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - andy-code-index-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-code-index-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=andy_code_index;Username=andy_code_index;Password=andy_code_index_dev_password
      - AndyAuth__Authority=https://host.docker.internal:5001
      - AndyAuth__Audience=urn:andy-code-index-api
      - Rbac__ApiBaseUrl=https://host.docker.internal:7003
      - Rbac__ApplicationCode=code-index
      - Indexing__DataDir=/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5101:8443"
      - "5102:8080"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
      - code_index_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - andy-code-index-network

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: andy-code-index-web
    depends_on:
      - api
    ports:
      - "4201:80"
    restart: unless-stopped
    networks:
      - andy-code-index-network

  ollama:
    image: ollama/ollama:latest
    container_name: andy-code-index-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - andy-code-index-network
    profiles:
      - ollama

volumes:
  postgres_data:
  code_index_data:
  ollama_data:

networks:
  andy-code-index-network:
    driver: bridge
