services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: andy-code-index-postgres
    environment:
      POSTGRES_DB: andy_code_index
      POSTGRES_USER: andy_code_index
      POSTGRES_PASSWORD: andy_code_index_dev_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "7436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U andy_code_index -d andy_code_index"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - andy-code-index-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        certs: ./certs
    container_name: andy-code-index-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:8443;http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=andy_code_index;Username=andy_code_index;Password=andy_code_index_dev_password
      - AndyAuth__Authority=https://host.docker.internal:${ANDY_AUTH_DOCKER_HTTPS:-7001}
      - AndyAuth__Audience=urn:andy-code-index-api
      - AndyAuth__RequireHttpsMetadata=false
      - Rbac__ApiBaseUrl=https://host.docker.internal:${ANDY_RBAC_DOCKER_HTTPS:-7003}
      - Rbac__ApplicationCode=code-index
      # andy-settings client wiring (epic rivoli-ai/conductor#771)
      # Port resolved from andy-settings' config/registration.json via
      # ../andy-settings/scripts/generate-docker-ports-env.sh. See rivoli-ai/conductor#793.
      - AndySettings__ApiBaseUrl=https://host.docker.internal:${ANDY_SETTINGS_DOCKER_HTTPS:-7300}
      - AndySettings__ApplicationCode=andy-code-index
      - Indexing__DataDir=/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "7101:8443"
      - "7102:8080"
      - "6201:8443"
    volumes:
      - ./certs:/usr/local/share/ca-certificates/custom:ro
      - code_index_data:/data
      - dpkeys:/app/.aspnet/DataProtection-Keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost:8443/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - andy-code-index-network

  ollama:
    image: ollama/ollama:latest
    container_name: andy-code-index-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - andy-code-index-network
    profiles:
      - ollama

volumes:
  dpkeys:
  postgres_data:
  code_index_data:
  ollama_data:

networks:
  andy-code-index-network:
    driver: bridge
